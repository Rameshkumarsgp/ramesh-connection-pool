# Set root category priority to ERROR and its only appender to A1.
log4j.rootCategory=INFO, CONSOLE, LOGFILE

# CONSOLE is set to be a ConsoleAppender using a PatternLayout.
log4j.appender.CONSOLE=org.apache.log4j.ConsoleAppender
log4j.appender.CONSOLE.Threshold=TRACE
log4j.appender.CONSOLE.layout=org.apache.log4j.PatternLayout
log4j.appender.CONSOLE.layout.ConversionPattern=%d{HH:mm:ss} %-5p [%c{1}]\t%m%n

# LOGFILE is set to be a File appender using a PatternLayout.
log4j.appender.LOGFILE=org.apache.log4j.DailyRollingFileAppender 
log4j.appender.LOGFILE.DatePattern='.'yyyy-MM-dd
log4j.appender.LOGFILE.File=./logs/Log.txt
log4j.appender.LOGFILE.Append=true
log4j.appender.LOGFILE.Threshold=DEBUG
log4j.appender.LOGFILE.layout=org.apache.log4j.PatternLayout
log4j.appender.LOGFILE.layout.ConversionPattern=%d %-5p %c\t%m%n
#log4j.appender.LOGFILE.MaxFileSize=100KB
# Keep backups over the coarse of each day
#log4j.appender.LOGFILE.MaxBackupIndex=1


#package specific levels
log4j.logger.org=WARN
log4j.logger.org.apache=WARN
log4j.logger.com.mysql.jdbc=INFO
log4j.logger.com.rakesh=DEBUG